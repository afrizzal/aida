name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (review a-WR-a2): no step writes to the repository or calls the GitHub API;
# checkout needs read access only, and the setup-node cache uses the runner's own cache token.
permissions:
  contents: read

# D-27: build and test steps outside Docker must not phone home (Next.js telemetry,
# Prisma checkpoint ping).
env:
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"

jobs:
  build:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6          # reads the packageManager field in package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # prisma.config.ts evaluates env("DATABASE_URL") at module load — even `generate`
      # (which never connects) fails without it. .env.example holds only placeholders.
      - name: Provide placeholder env
        run: cp .env.example .env

      # src/generated/prisma/client is gitignored; typecheck and build both need it.
      - run: pnpm db:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
