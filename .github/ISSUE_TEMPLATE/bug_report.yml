name: Bug report
description: Something in AIDA is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not report a security vulnerability here.** See [`.github/SECURITY.md`](https://github.com/afrizzal/aida/blob/master/.github/SECURITY.md) for a private disclosure path.

  - type: input
    id: version
    attributes:
      label: AIDA version / commit
      description: The release tag or commit hash you're running.
      placeholder: v0.4.0 or a1b2c3d
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running AIDA?
      options:
        - docker compose (self-hosted)
        - local dev (pnpm dev)
        - other
    validations:
      required: true

  - type: dropdown
    id: ai-enabled
    attributes:
      label: Is AI enabled?
      description: The single most useful triage signal — AI-related bugs behave very differently per provider.
      options:
        - AI off
        - OpenAI
        - Anthropic
        - Ollama (local)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so we can reproduce it ourselves.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please redact any secrets, API keys, or customer data before pasting.
      placeholder: docker compose logs app worker --tail=100
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: true
