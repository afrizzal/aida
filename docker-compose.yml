services:
  # ── Postgres 16 + pgvector ────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aida}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aida}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── One-shot migration (runs prisma migrate deploy on startup) ────────────
  # Uses the builder stage, which has the full node_modules including the Prisma CLI
  migrate:
    build:
      context: .
      target: builder
    # Runs as the non-root `node` user of the builder stage (D-08). The Prisma CLI is called
    # through node, not pnpm: corepack's pnpm download lives in root's cache at build time, so a
    # non-root runtime would fetch pnpm from the registry (egress, and a failure offline). tsx is
    # called the same way: scripts/check-database-url.ts runs the D-12(4) boot guard first and stops
    # migrate, naming only the component, when DATABASE_URL disagrees with AIDA_EXPECT_DB_*.
    command: ["sh", "-c", "node node_modules/tsx/dist/cli.mjs scripts/check-database-url.ts && exec node node_modules/prisma/build/index.js migrate deploy"]
    depends_on:
      db:
        condition: service_healthy
    # DATABASE_URL of migrate, app and worker (D-12, AIDA-35): an AIDA_DATABASE_URL with every
    # component percent-encoded wins (D-12(1); generate it with scripts/database-url.sh when the
    # password has a URL-reserved character). Unset, the fallback builds the same URL as before, so
    # a URL-safe install needs no new variable (D-12(2)). It is not named DATABASE_URL because the
    # .env DATABASE_URL line is the local-development URL and points at localhost. AIDA_EXPECT_DB_*
    # carry the parts the boot guard compares against the decoded URL (D-12(4)), under names that
    # `next dev` and the E2E server never receive; they add no new secret class, since the password
    # is already inside DATABASE_URL.
    environment:
      DATABASE_URL: ${AIDA_DATABASE_URL:-postgresql://${POSTGRES_USER:-aida}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aida}}
      AIDA_EXPECT_DB_USER: ${POSTGRES_USER:-aida}
      AIDA_EXPECT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      AIDA_EXPECT_DB_NAME: ${POSTGRES_DB:-aida}
      # Prisma's CLI phones home to checkpoint.prisma.io for an update-check ping on every
      # `migrate deploy` unless disabled — found via 07-09.1's egress-isolation test (the DNS
      # capture recorded this real, if silently-failing, third-party attempt). Disabling it
      # keeps the "no third-party egress" claim (CLAUDE.md) literally true, not just true by
      # virtue of the ping being blocked at the network layer.
      CHECKPOINT_DISABLE: "1"
    restart: "no"

  # ── Next.js app (node server.js — standalone output) ─────────────────────
  # Shared image with worker; only the command differs (D-09)
  app:
    build: .
    command: ["node", "server.js"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${AIDA_DATABASE_URL:-postgresql://${POSTGRES_USER:-aida}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aida}}
      AIDA_EXPECT_DB_USER: ${POSTGRES_USER:-aida}
      AIDA_EXPECT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      AIDA_EXPECT_DB_NAME: ${POSTGRES_DB:-aida}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost,https://localhost}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      # Demo mode (AIDA-22, AIDA-37): DEMO_MODE=true seeds the demo only into an empty database (no
      # organization, no user); any other database gets one refusal log line, no write, and a normal start.
      # NEVER enable this on an internet-facing instance — the credentials are documented publicly.
      DEMO_MODE: ${DEMO_MODE:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_AGENT_EMAIL: ${DEMO_AGENT_EMAIL:-}
      HOSTNAME: "0.0.0.0"
      DB_POOL_MAX: "10"
      UPLOADS_DIR: /data/uploads
      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:-}
      # Advanced: leave blank behind the shipped Caddy; see docs/OPERATIONS.md "Client IP and reverse proxies"
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      # Credential encryption at rest (email IMAP/SMTP passwords, future LLM keys) —
      # required for saving channel credentials in Settings; see .env.example
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      # Alpine's `localhost` resolves to ::1 (IPv6) but Next.js listens on 0.0.0.0 (IPv4 only).
      # Use explicit 127.0.0.1 to force IPv4.
      # The probe path is unthrottled and refused by Caddy, so public traffic can never fail this check (review C2).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/probe || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Boot-time demo seeding (DEMO_MODE=true) runs inside instrumentation.register()
      # before the server accepts connections, so the container needs a grace window
      # before health probes count against it.
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ── pg-boss worker (node dist/worker.mjs — esbuild ESM bundle) ──────────
  # Same image as app; independent restart policy and higher memory limit
  worker:
    build: .
    command: ["node", "dist/worker.mjs"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${AIDA_DATABASE_URL:-postgresql://${POSTGRES_USER:-aida}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aida}}
      AIDA_EXPECT_DB_USER: ${POSTGRES_USER:-aida}
      AIDA_EXPECT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      AIDA_EXPECT_DB_NAME: ${POSTGRES_DB:-aida}
      DB_POOL_MAX: "5"
      # Worker decrypts stored IMAP/SMTP credentials for the poll + outbound-send jobs
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Shared uploads volume (K68): the project file cleanup job deletes stored files and the
      # inbound email poll stores attachments here, so both reach the files the app serves.
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ── One-shot: prepare the backups volume for the non-root backup service (U-16) ──
  # Why this one step runs as root: a new named volume's root directory is created root:root
  # 0755, the pgvector/pgvector:pg16 image has no account or directory owned by 1000 for the volume
  # to inherit, and D-01 forbids a new image. The other way, a root entrypoint in `backup`, would run
  # the whole backup as root. So this container only touches the /backups mount point: it exits at
  # once when it already reads 1000:1000 mode 700, otherwise it sets mode 0700 (first, so it needs
  # no CAP_FOWNER) and then owner 1000:1000, never recursively and never on uploads_data. No
  # network, a read-only root filesystem, CAP_CHOWN only. See docs/OPERATIONS.md "Backups".
  backup-init:
    image: pgvector/pgvector:pg16
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >-
        if [ "$$(stat -c '%u:%g:%a' /backups)" = 1000:1000:700 ]; then
        echo '[backup-init] /backups already 1000:1000 mode 700'; exit 0; fi;
        if chmod 0700 /backups && chown 1000:1000 /backups; then
        echo '[backup-init] /backups prepared: 1000:1000 mode 700'; exit 0; fi;
        echo '[backup-init] could not prepare /backups; see docs/OPERATIONS.md, Backups' >&2; exit 1
    volumes:
      - backups_data:/backups
    # The image declares VOLUME /var/lib/postgresql/data; a tmpfs there keeps `docker compose up`
    # from creating an anonymous volume for this service.
    tmpfs:
      - /var/lib/postgresql/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # ── Scheduled backups (AIDA-33, D-01): database dump + uploads archive, daily ──
  # Same image as db (it ships pg_dump and pg_restore): no build, no new image. scheduler.sh runs
  # aida-backup.sh at BACKUP_SCHEDULE (UTC) and keeps the BACKUP_RETENTION newest successful sets
  # in backups_data; BACKUP_ENABLED=false keeps the container up without running a backup. It
  # reaches the database with libpq variables and PGPASSWORD, never a URL, reads uploads read-only
  # and records each run in SystemSetting backup:lastRun (Settings -> Backups). Manual run:
  # scripts/backup.sh. See docs/OPERATIONS.md "Backups".
  backup:
    image: pgvector/pgvector:pg16
    # node's UID and GID in the app image (Dockerfile:87). The PostgreSQL image has no node
    # account, so the user is numeric; uploads written by app and worker stay readable.
    user: "1000:1000"
    entrypoint: ["sh", "/opt/aida-backup/scheduler.sh"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backup-init:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-aida}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-aida}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-02:00}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      # Advanced: see docs/OPERATIONS.md "Backups" before changing these three.
      BACKUP_LEASE_TTL_SECONDS: ${BACKUP_LEASE_TTL_SECONDS:-900}
      BACKUP_FENCE_WAIT_SECONDS: ${BACKUP_FENCE_WAIT_SECONDS:-300}
      BACKUP_MAX_RUN_SECONDS: ${BACKUP_MAX_RUN_SECONDS:-21600}
      BACKUP_DIR: /backups
      UPLOADS_DIR: /data/uploads
    volumes:
      - ./scripts/backup:/opt/aida-backup:ro
      # The manifest's app version is read from this file (aida-backup.sh BACKUP_APP_VERSION_FILE).
      - ./package.json:/opt/aida-backup-meta/package.json:ro
      - uploads_data:/data/uploads:ro
      - backups_data:/backups
    # The image declares VOLUME /var/lib/postgresql/data; a tmpfs there keeps `docker compose up`
    # from creating an anonymous volume for this service.
    tmpfs:
      - /var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Caddy reverse proxy (auto-HTTPS for real domains, local CA for localhost) ──
  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    restart: unless-stopped

volumes:
  # Single source of truth for Postgres data — backup = snapshot this volume (D-11)
  postgres_data:
  # Attachment storage (ticket and task attachments, the workspace logo) — mounted read-write by
  # both `app` and `worker`: the app stores uploads in the request/response cycle; the worker stores
  # inbound email attachments and reads and deletes files for the scheduled file cleanup.
  # `backup` mounts it read-only and archives it into each backup set.
  uploads_data:
  # Backup sets, one directory per set (D-01, U-16). Prepared once by `backup-init` (owner
  # 1000:1000, mode 0700, on the mount point only) and written by `backup` as 1000:1000. It holds
  # tenant data: copying it off this host is the operator's job (docs/OPERATIONS.md "Backups").
  backups_data:
  caddy_data:
  caddy_config:
